name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Smoke test
        shell: bash
        run: |
          target/release/deskcrew --version
          python scripts/mcp-smoke.py target/release/deskcrew.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages for X11, accessibility and a GTK test window
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb at-spi2-core dbus-x11 python3-gi gir1.2-gtk-3.0 libatk-adaptor xclip
      - name: Build
        run: cargo build --release --locked --bins --examples
      - name: Unit tests
        run: cargo test --release --locked
      - name: Smoke test
        run: |
          target/release/deskcrew --version
          python3 scripts/mcp-smoke.py target/release/deskcrew
      - name: Live commands on a GTK window under Xvfb
        run: dbus-run-session -- bash scripts/linux-live.sh target/release/deskcrew
      - name: Live commands on a toolkit-free window, without at-spi2-core
        run: DESKCREW_FORM=target/release/examples/linux_form bash scripts/linux-live.sh target/release/deskcrew 98
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deskcrew-linux
          path: |
            target/release/deskcrew
            shots/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/deskcrew \
            target/aarch64-apple-darwin/release/deskcrew \
            target/x86_64-apple-darwin/release/deskcrew
          codesign --force --sign - out/deskcrew
          lipo -info out/deskcrew
      - name: Unit tests
        run: cargo test --release --locked
      - name: Smoke test
        run: |
          out/deskcrew --version
          out/deskcrew help | head -3
          python3 scripts/mcp-smoke.py out/deskcrew
      # GitHub's Mac runners allow Accessibility, so deskcrew can read and type into TextEdit there.
      - name: Live commands on TextEdit
        run: bash scripts/mac-live.sh out/deskcrew
      - uses: actions/upload-artifact@v4
        with:
          name: deskcrew-universal-apple-darwin
          path: out/deskcrew

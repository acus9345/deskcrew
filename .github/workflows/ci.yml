name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Smoke test
        shell: bash
        run: |
          target/release/deskcrew --version
          python scripts/mcp-smoke.py target/release/deskcrew.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/deskcrew \
            target/aarch64-apple-darwin/release/deskcrew \
            target/x86_64-apple-darwin/release/deskcrew
          codesign --force --sign - out/deskcrew
          lipo -info out/deskcrew
      - name: Unit tests
        run: cargo test --release --locked
      - name: Smoke test
        run: |
          out/deskcrew --version
          out/deskcrew help | head -3
          python3 scripts/mcp-smoke.py out/deskcrew
      # GitHub's Mac runners allow Accessibility, so deskcrew can read and type into TextEdit there.
      - name: Live commands on TextEdit
        run: bash scripts/mac-live.sh out/deskcrew
      - uses: actions/upload-artifact@v4
        with:
          name: deskcrew-universal-apple-darwin
          path: out/deskcrew

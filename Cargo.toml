[package]
name = "deskcrew"
version = "0.1.0"
edition = "2024"
description = "Every coding agent gets its own cursor on your Windows desktop, for very few tokens."
license = "MIT"
repository = "https://github.com/acus9345/deskcrew"
readme = "README.md"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
